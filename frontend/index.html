<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能助手</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ============ 登录页面 ============ -->
    <div id="login-page" class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <rect width="48" height="48" rx="12" fill="url(#logo-grad)"/>
                        <path d="M24 12L36 18V30L24 36L12 30V18L24 12Z" stroke="white" stroke-width="2" fill="none"/>
                        <circle cx="24" cy="24" r="4" fill="white"/>
                        <defs>
                            <linearGradient id="logo-grad" x1="0" y1="0" x2="48" y2="48">
                                <stop stop-color="#6366f1"/>
                                <stop offset="1" stop-color="#8b5cf6"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1>AI 智能助手</h1>
                <p>欢迎回来，请登录您的账号</p>
            </div>

            <!-- 登录表单 -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-username">用户名 / 邮箱</label>
                    <input type="text" id="login-username" placeholder="请输入用户名或邮箱" required>
                </div>
                <div class="form-group">
                    <label for="login-password">密码</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="请输入密码" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('login-password', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-me">
                        <span>记住我</span>
                    </label>
                    <a href="#" class="link-text">忘记密码？</a>
                </div>
                <button type="submit" class="btn-primary">登 录</button>
                <p class="auth-switch">还没有账号？<a href="#" onclick="switchAuth('register')">立即注册</a></p>
            </form>

            <!-- 注册表单 -->
            <form id="register-form" class="auth-form" style="display:none;">
                <div class="form-group">
                    <label for="reg-username">用户名</label>
                    <input type="text" id="reg-username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">邮箱</label>
                    <input type="email" id="reg-email" placeholder="请输入邮箱" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">密码</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" placeholder="至少6位密码" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('reg-password', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-password-confirm">确认密码</label>
                    <input type="password" id="reg-password-confirm" placeholder="请再次输入密码" required>
                </div>
                <button type="submit" class="btn-primary">注 册</button>
                <p class="auth-switch">已有账号？<a href="#" onclick="switchAuth('login')">返回登录</a></p>
            </form>
        </div>
    </div>

    <!-- ============ 聊天主页面 ============ -->
    <div id="chat-app" class="chat-app" style="display:none;">

        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="btn-new-chat" onclick="createNewChat()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    <span>新建对话</span>
                </button>
            </div>

            <!-- Tab 切换 -->
            <div class="sidebar-tabs">
                <button class="sidebar-tab active" id="tab-chats" onclick="switchSidebarTab('chats')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>对话</span>
                </button>
                <button class="sidebar-tab" id="tab-knowledge" onclick="switchSidebarTab('knowledge')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                    </svg>
                    <span>知识库</span>
                </button>
            </div>

            <!-- 对话列表 -->
            <div class="tab-content active" id="tab-content-chats">
                <div class="sidebar-search">
                    <div class="search-box">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input type="text" id="search-chat" placeholder="搜索对话..." oninput="searchChats()">
                    </div>
                </div>

                <div class="chat-history-list" id="chat-history-list">
                    <!-- 动态生成 -->
                </div>
            </div>

            <!-- 知识库管理 -->
            <div class="tab-content" id="tab-content-knowledge">
                <div class="kb-section">
                    <button class="btn-new-kb" onclick="showCreateKbModal()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        <span>创建知识库</span>
                    </button>
                    <div class="kb-list" id="kb-list">
                        <!-- 动态生成 -->
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="user-info" id="user-info">
                    <div class="avatar" id="user-avatar">U</div>
                    <div class="user-details">
                        <span class="user-name" id="user-name">用户</span>
                        <span class="user-plan">免费版</span>
                    </div>
                    <button class="btn-logout" onclick="logout()" title="退出登录">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                    </button>
                </div>
            </div>
        </aside>

        <!-- 主聊天区 -->
        <main class="chat-main" id="chat-main"
              ondragover="handleDragOver(event)"
              ondragleave="handleDragLeave(event)"
              ondrop="handleDrop(event)">
            <!-- 拖拽提示遮罩 -->
            <div class="drag-drop-overlay" id="drag-drop-overlay">
                <div class="drag-drop-content">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <p>松开鼠标即可上传图片或文件</p>
                </div>
            </div>
            <!-- 顶部栏 -->
            <header class="chat-header">
                <button class="btn-toggle-sidebar" onclick="toggleSidebar()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <h2 class="chat-title" id="current-chat-title">新对话</h2>
                <div class="header-actions">
                    <button class="btn-icon" onclick="showAllSentFiles()" title="查看已发送的文件">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                    </button>
                    <button class="btn-icon" onclick="clearCurrentChat()" title="清空对话">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- 消息列表 -->
            <div class="message-list" id="message-list">
                <!-- 欢迎界面 -->
                <div class="welcome-screen" id="welcome-screen">
                    <div class="welcome-logo">
                        <svg width="64" height="64" viewBox="0 0 48 48" fill="none">
                            <rect width="48" height="48" rx="12" fill="url(#welcome-grad)"/>
                            <path d="M24 12L36 18V30L24 36L12 30V18L24 12Z" stroke="white" stroke-width="2" fill="none"/>
                            <circle cx="24" cy="24" r="4" fill="white"/>
                            <defs>
                                <linearGradient id="welcome-grad" x1="0" y1="0" x2="48" y2="48">
                                    <stop stop-color="#6366f1"/>
                                    <stop offset="1" stop-color="#8b5cf6"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <h2>有什么可以帮你的？</h2>
                    <p>我可以回答问题、分析图片和文件，随时为你服务</p>
                    <div class="suggestion-cards" id="suggestion-cards">
                        <!-- 动态生成 -->
                    </div>
                </div>
            </div>

            <!-- 输入区 -->
            <div class="chat-input-area">
                <!-- 知识库选择器 -->
                <div class="kb-selector-area" id="kb-selector-area">
                    <div class="kb-selector-dropdown">
                        <button class="kb-selector-btn" id="kb-selector-btn" onclick="toggleKbSelector()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                            </svg>
                            <span id="kb-selector-label">不使用知识库</span>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:auto;">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </button>
                        <div class="kb-selector-menu" id="kb-selector-menu" style="display:none;">
                            <div class="kb-selector-item active" onclick="selectKbForChat(null)">
                                <span>不使用知识库</span>
                            </div>
                            <div id="kb-selector-options">
                                <!-- 动态生成 -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 文件预览区 -->
                <div class="file-preview-area" id="file-preview-area" style="display:none;">
                    <!-- 动态生成 -->
                </div>

                <div class="input-wrapper">
                    <button class="btn-attach" onclick="triggerFileUpload()" title="上传文件/图片">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                        </svg>
                        <span class="btn-attach-badge" id="attach-badge" style="display:none;">0</span>
                    </button>
                    <input type="file" id="file-input" multiple accept="image/*,.pdf,.doc,.docx,.txt,.csv,.xlsx,.xls,.md" style="display:none;" onchange="handleFileSelect(event)">

                    <div class="input-box">
                        <textarea id="message-input" placeholder="输入消息，按 Enter 发送，Shift+Enter 换行..." rows="1" oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
                    </div>

                    <button class="btn-send" id="btn-send" onclick="sendMessage()" title="发送">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
                <p class="input-hint">支持选择/拖拽多个图片和文件 · 按 Enter 发送，Shift+Enter 换行 · AI 生成内容仅供参考，请注意核实重要信息</p>
            </div>
        </main>
    </div>

    <!-- ============ 图片预览弹窗 ============ -->
    <div class="image-modal" id="image-modal" onclick="closeImageModal(event)">
        <div class="image-modal-content">
            <img id="modal-image" src="" alt="预览图片">
            <button class="btn-close-modal" onclick="closeImageModal()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- ============ 已发送文件弹窗 ============ -->
    <div class="modal-overlay" id="sent-files-modal" onclick="closeModalOnOverlay(event, 'sent-files-modal')">
        <div class="modal-card modal-lg" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>已发送的文件</h3>
                <button class="modal-close" onclick="closeModal('sent-files-modal')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body sent-files-body" id="sent-files-body">
                <!-- 动态生成 -->
            </div>
        </div>
    </div>

    <!-- ============ 提示消息 ============ -->
    <div class="toast-container" id="toast-container"></div>

    <!-- ============ 创建知识库弹窗 ============ -->
    <div class="modal-overlay" id="create-kb-modal" onclick="closeModalOnOverlay(event, 'create-kb-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>创建知识库</h3>
                <button class="modal-close" onclick="closeModal('create-kb-modal')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="kb-name-input">知识库名称</label>
                    <input type="text" id="kb-name-input" placeholder="例如：Python学习资料" maxlength="50">
                </div>
                <div class="form-group">
                    <label for="kb-desc-input">描述（可选）</label>
                    <input type="text" id="kb-desc-input" placeholder="简要描述知识库用途" maxlength="200">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('create-kb-modal')">取消</button>
                <button class="btn-primary" onclick="confirmCreateKb()">创建</button>
            </div>
        </div>
    </div>

    <!-- ============ 知识库详情弹窗 ============ -->
    <div class="modal-overlay" id="kb-detail-modal" onclick="closeModalOnOverlay(event, 'kb-detail-modal')">
        <div class="modal-card modal-lg" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="kb-detail-title">知识库文档</h3>
                <button class="modal-close" onclick="closeModal('kb-detail-modal')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="kb-upload-area">
                    <button class="btn-upload-doc" onclick="triggerKbDocUpload()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        <span>上传文档</span>
                    </button>
                    <input type="file" id="kb-doc-input" multiple accept=".pdf,.doc,.docx,.txt,.csv,.xlsx,.xls,.md" style="display:none;" onchange="handleKbDocUpload(event)">
                    <span class="kb-upload-hint">支持 PDF、Word、TXT、Markdown、CSV 等格式</span>
                </div>
                <div class="kb-doc-list" id="kb-doc-list">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- JS 模块（按依赖顺序加载） -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/knowledge-base.js"></script>
    <script src="js/file-upload.js"></script>
    <script src="app.js"></script>
</body>
</html>
