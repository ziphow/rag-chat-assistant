# nginx：托管前端静态资源 + 反代后端 API
# 前端与后端同源；前端把 /auth /chats /message /files /knowledge-bases /uploads 代理到 backend 容器

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源（单页应用，未命中静态文件则回退 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 REST API + SSE 流式
    location ~ ^/(auth|chats|message|files|knowledge-bases)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # SSE 流式响应支持：关缓冲、关闭超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后端挂载的上传文件（/uploads 静态目录也在后端容器里）
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}