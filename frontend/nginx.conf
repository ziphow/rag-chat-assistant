# nginx：托管前端静态资源 + 反代后端 API
# 前端与后端同源；前端把 /auth /chats /message /files /knowledge-bases /uploads 代理到 backend 容器

server {
    listen 80;
    server_name _;

    # 允许上传较大文件（图片/文档），与前端/后端 10MB 限制保持一致
    # nginx 默认仅 1MB，超限会直接中断请求体导致上传报 ERR_CONNECTION_RESET/Failed to fetch
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源（单页应用，未命中静态文件则回退 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 REST API + SSE 流式
    # 正则匹配两种路径：/chats 这类无子路径的端点，以及 /chats/123/messages 这类带子路径的
    location ~ ^/(auth|chats|message|files|knowledge-bases)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # SSE 流式响应支持：关缓冲、关闭超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后端挂载的上传文件（/uploads 静态目录也在后端容器里）
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}

# ★ 8080 端口：仅反代后端 API，供 Cloudflare Worker（Pages Functions）在服务器端访问。
# 作用：Cloudflare Worker 出站 fetch 不能用裸 IP（会报 error 1003），也不能走 80 端口域名
# （腾讯云对未备案域名 80 端口做拦截，302 到 dnspod.qcloud.com）。
# 用 sslip.io 域名 + 非 80 端口 即可同时绕过这两者。
server {
    listen 8080;
    server_name _;

    # 与上传大小限制保持一致
    client_max_body_size 10m;

    # 仅反代 API 前缀；8080 不承载静态页面
    location ~ ^/(auth|chats|message|files|knowledge-bases)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # SSE 流式响应支持：关缓冲、关闭超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}